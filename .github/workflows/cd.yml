name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t phuctranvn/equipment-maintenance:${{ steps.meta.outputs.tag }} \
            -t phuctranvn/equipment-maintenance:latest \
            .

      - name: Push Docker image
        run: |
          docker push phuctranvn/equipment-maintenance:${{ steps.meta.outputs.tag }}
          docker push phuctranvn/equipment-maintenance:latest

      - name: Deploy to Azure VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: azureuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/equipment-maintenance
            export IMAGE_TAG=${{ steps.meta.outputs.tag }}
            docker compose pull app
            docker compose up -d
            docker image prune -f